<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FB Fanpage Auto</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ─── Header ──────────────────────────────────────────── -->
  <div class="header">
    <span class="logo">👍</span>
    <h1>FB Fanpage Auto</h1>
    <div class="status-badge" id="status-badge">
      <div class="status-dot stopped" id="status-dot"></div>
      <span id="status-text">Đã dừng</span>
    </div>
  </div>

  <!-- ─── Main Content ───────────────────────────────────── -->
  <div class="content">

    <!-- Comment Input -->
    <div class="field-group">
      <label for="comment-input">💬 Nội dung bình luận</label>
      <textarea
        id="comment-input"
        placeholder="Nhập nội dung bình luận tại đây..."
        rows="3"
      ></textarea>
    </div>

    <!-- Reload Delay -->
    <div class="field-group field-inline">
      <label for="reload-delay">⏱ Reload sau (giây)</label>
      <div class="input-with-unit">
        <input type="number" id="reload-delay" min="5" max="3600" value="30" />
        <span class="unit">giây</span>
      </div>
    </div>

    <!-- Chọn bài viết cần quét -->
    <div class="field-group">
      <label>🎯 Bài viết cần xử lý</label>
      <div class="post-select-box">
        <label class="radio-row">
          <input type="radio" name="targetMode" value="limit" id="mode-limit" checked />
          <span>Quét số bài mới nhất:</span>
          <input type="number" id="post-limit" min="1" max="20" value="2" />
        </label>
        <label class="radio-row">
          <input type="radio" name="targetMode" value="custom" id="mode-custom" />
          <span>Hoặc chọn bài test cụ thể:</span>
        </label>
        <div class="custom-input-wrap">
          <input type="text" id="custom-posts" placeholder="VD: 0 hoặc 0, 1 hoặc 1, 2" />
          <span class="hint-text">Chỉ số: 0 = bài 1, 1 = bài 2, 2 = bài 3...</span>
        </div>
      </div>
    </div>

    <!-- Cấu hình khung giờ cao điểm (Golden Hours) -->
    <div class="field-group">
      <div class="field-inline peak-header">
        <label for="peak-enable">⚡ Khung giờ cao điểm (Reload riêng)</label>
        <input type="checkbox" id="peak-enable" checked />
      </div>
      <div id="peak-settings-box" class="sub-settings-box">
        <div class="sub-row">
          <span>Khung giờ cố định:</span>
          <input type="text" id="peak-hours" value="10, 12, 15, 17, 20" placeholder="10, 12, 15, 17, 20" />
        </div>
        <div class="sub-row">
          <span>Duy trì mỗi khung:</span>
          <div class="input-with-unit">
            <input type="number" id="peak-duration" min="1" max="180" value="15" />
            <span class="unit">phút</span>
          </div>
        </div>
        <div class="sub-row">
          <span>Reload trong khung giờ:</span>
          <div class="input-with-unit">
            <input type="number" id="peak-reload-delay" min="3" max="3600" value="15" />
            <span class="unit">giây</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Start / Stop Button -->
    <button class="btn btn-start" id="toggle-btn">▶ Bắt đầu</button>

    <!-- Log Section -->
    <div class="log-section">
      <div class="log-header">
        <span>📋 Nhật ký hoạt động</span>
        <div class="log-actions">
          <button class="btn-icon" id="expand-log-btn" title="Xem log đầy đủ">⛶</button>
          <button class="btn-icon" id="clear-log-btn" title="Xóa log">🗑</button>
        </div>
      </div>
      <!-- Log entries được render dưới dạng div thay vì textarea -->
      <div id="log-area" role="log" aria-live="polite"></div>
    </div>

  </div>

  <!-- ─── Footer ──────────────────────────────────────────── -->
  <div class="footer">FB Fanpage Auto v1.1 – Chỉ dùng cho mục đích cá nhân</div>

  <!-- ─── Log Fullscreen Modal ───────────────────────────── -->
  <div class="modal-overlay hidden" id="log-modal">
    <div class="modal">
      <div class="modal-header">
        <span>📋 Nhật ký đầy đủ</span>
        <button class="btn-icon" id="close-modal-btn">✕</button>
      </div>
      <div id="log-modal-area" class="modal-log-area"></div>
      <div class="modal-footer">
        <button class="btn-icon-text" id="modal-clear-btn">🗑 Xóa log</button>
        <button class="btn-icon-text primary" id="modal-copy-btn">📋 Copy tất cả</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
